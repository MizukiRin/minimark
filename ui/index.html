<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMark</title>

  <!-- 本地样式 -->
  <link rel="stylesheet" href="style.css">

  <!-- 本地 KaTeX 样式与脚本 -->
  <link rel="stylesheet" href="libs/katex/katex.min.css">
  <script src="libs/katex/katex.min.js"></script>
  <script src="libs/katex/auto-render.min.js"></script>

  <!-- 本地 Prism 语法高亮样式与脚本 -->
  <link rel="stylesheet" href="libs/prism/prism.min.css">
  <script src="libs/prism/prism.min.js"></script>
  <script src="libs/prism/prism-python.min.js"></script>
  <script src="libs/prism/prism-javascript.min.js"></script>
  <script src="libs/prism/prism-json.min.js"></script>
  <script src="libs/prism/prism-bash.min.js"></script>
  <script src="libs/prism/prism-markdown.min.js"></script>

  <!-- 本地 Mermaid 图表脚本 -->
  <script src="libs/mermaid.min.js"></script>

  <!-- 本地 Marked 渲染脚本 -->
  <script src="libs/marked.min.js"></script>

  <!-- QtWebChannel 桥接脚本 -->
  <script src="libs/qwebchannel.js"></script>
</head>
<body data-theme="light">

  <!-- 顶部标题与多标签栏 -->
  <div class="titlebar" id="titlebar">
    <div class="brand-section">
      <!-- 侧边栏折叠按钮 -->
      <button class="icon-btn" onclick="app.toggleSidebar()" data-i18n-title="toggleSidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
        </svg>
      </button>

      <div class="brand-logo" onclick="app.showHomeDashboard()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span data-i18n="brand">MiniMark</span>
      </div>
    </div>

    <!-- 动态标签页容器 -->
    <div class="tabs-container" id="tabs-container"></div>

    <!-- 顶部右侧功能按钮 -->
    <div class="top-actions">
      <!-- 保存文件 -->
      <button class="icon-btn" onclick="app.handleSaveFile()" data-i18n-title="saveFile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
      </button>

      <!-- 另存为文件 (Save As) -->
      <button class="icon-btn" onclick="app.handleSaveAsFile(true)" data-i18n-title="saveAsFile">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><path d="M12 3v6m-3-3l3-3 3 3"/>
        </svg>
      </button>

      <!-- 搜索文本 -->
      <button class="icon-btn" onclick="app.toggleSearch(false)" data-i18n-title="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- 切换语言 -->
      <button class="icon-btn" onclick="app.toggleLang()" id="btn-lang" title="Language">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>

      <!-- 切换深浅主题 -->
      <button class="icon-btn" onclick="app.toggleTheme()" id="btn-theme" title="Theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 主体工作区 -->
  <div class="main-body">
    <!-- 左侧工作区目录树与大纲 -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" id="workspace-title" data-i18n="workspace">WORKSPACE</span>
        <div class="sidebar-toolbar">
          <!-- 工作区工具栏：打开文件夹 -->
          <button class="icon-btn" style="width: 22px; height: 22px;" onclick="app.handleOpenFolder()" data-i18n-title="openFolder">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <!-- 工作区工具栏：打开单文件 -->
          <button class="icon-btn" style="width: 22px; height: 22px;" onclick="app.handleOpenFile()" data-i18n-title="openFile">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
            </svg>
          </button>
          <!-- 工作区工具栏：新建临时文件 -->
          <button class="icon-btn" style="width: 22px; height: 22px;" onclick="app.handleNewFile()" data-i18n-title="newFile">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <!-- 工作区工具栏：大纲开关 -->
          <button class="icon-btn" id="btn-sidebar-outline" style="width: 22px; height: 22px;" onclick="app.toggleOutline()" data-i18n-title="toggleOutline">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="file-tree" id="file-tree">
        <!-- 空状态时展示快捷操作卡片 -->
        <div class="sidebar-empty-actions" id="sidebar-empty-actions">
          <button class="sidebar-action-btn" onclick="app.handleOpenFolder()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span data-i18n="openFolderAction">打开文件夹工作区</span>
          </button>
          <button class="sidebar-action-btn" onclick="app.handleOpenFile()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span data-i18n="openFileAction">打开 Markdown 文件</span>
          </button>
          <button class="sidebar-action-btn" onclick="app.handleNewFile()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="newFileAction">新建临时文件</span>
          </button>
        </div>
      </div>

      <!-- 大纲可拖拽分割条 -->
      <div class="outline-splitter" id="outline-splitter" style="display: none;"></div>

      <!-- 工作区大纲区域 (默认隐藏，展开约 1/2) -->
      <div class="sidebar-outline" id="sidebar-outline" style="display: none;">
        <div class="outline-header">
          <div class="outline-title-group">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span class="outline-title" data-i18n="outline">大纲</span>
          </div>
          <button class="icon-btn" style="width: 20px; height: 20px;" onclick="app.toggleOutline()" data-i18n-title="hideOutline">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="outline-tree" id="outline-tree"></div>
      </div>
    </div>

    <!-- 主编辑 / 查看 / 主页工作区 -->
    <div class="editor-wrapper">

      <!-- 无页签时显示的主页 Dashboard -->
      <div class="home-dashboard" id="home-dashboard" style="display: none;">
        <div class="home-hero">
          <div class="home-logo">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h1>MiniMark</h1>
          </div>
          <p class="home-subtitle" data-i18n="homeSubtitle">极简、专注的 Markdown 编辑与查看器</p>
          <div class="home-actions">
            <button class="home-action-btn primary" onclick="app.handleNewFile()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span data-i18n="newFileAction">新建文件</span>
            </button>
            <button class="home-action-btn" onclick="app.handleOpenFolder()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span data-i18n="openFolderAction">打开文件夹</span>
            </button>
            <button class="home-action-btn" onclick="app.handleOpenFile()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span data-i18n="openFileAction">打开文件</span>
            </button>
          </div>
        </div>

        <div class="home-recents-grid">
          <div class="recent-section">
            <div class="recent-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span data-i18n="recentFolders">最近打开的文件夹</span>
            </div>
            <div class="recent-list" id="recent-folders-list"></div>
          </div>
          <div class="recent-section">
            <div class="recent-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span data-i18n="recentFiles">最近打开的文件</span>
            </div>
            <div class="recent-list" id="recent-files-list"></div>
          </div>
        </div>
      </div>

      <!-- 搜索与替换浮层面板 -->
      <div class="search-panel" id="search-panel" style="display: none;">
        <div class="search-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-input" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="搜索文本...">
          <span class="search-count" id="search-count">0/0</span>
          <button class="search-btn" onclick="app.findPrev()" data-i18n="findPrev">上一个</button>
          <button class="search-btn" onclick="app.findNext()" data-i18n="findNext">下一个</button>
          <button class="icon-btn" style="width: 20px; height: 20px;" onclick="app.toggleSearch(false)">✕</button>
        </div>
        <div class="search-row" id="replace-row" style="display: none;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <input type="text" class="search-input" id="replace-input" data-i18n-placeholder="replacePlaceholder" placeholder="替换为...">
          <button class="search-btn" onclick="app.replaceCurrent()" data-i18n="replaceOne">替换</button>
          <button class="search-btn" onclick="app.replaceAll()" data-i18n="replaceAll">全部</button>
        </div>
      </div>

      <!-- 右上角极简悬浮模式切换胶囊 (默认仅查看模式 👁) -->
      <div class="floating-mode-capsule" id="mode-capsule" title="切换视窗模式">
        <div class="mode-icon-current" id="capsule-current-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="mode-options" id="capsule-options">
          <button class="capsule-btn" id="btn-mode-edit" onclick="app.setMode('edit', event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
            </svg>
            <span data-i18n="modeEdit">仅编辑</span>
          </button>
          <button class="capsule-btn" id="btn-mode-split" onclick="app.setMode('split', event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>
            </svg>
            <span data-i18n="modeSplit">双栏</span>
          </button>
          <button class="capsule-btn active" id="btn-mode-preview" onclick="app.setMode('preview', event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <span data-i18n="modePreview">仅查看</span>
          </button>
        </div>
      </div>

      <!-- 右上角模式悬浮按钮下方的 Markdown 语法速查悬浮按钮 -->
      <button class="floating-tips-btn" id="floating-tips-btn" onclick="app.openMarkdownCheatSheet()" data-i18n-title="tipsCheatSheet" title="Markdown 语法速查指南">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>

      <!-- 左侧悬浮大纲按钮 (与工作区共享区域) -->
      <button class="floating-outline-btn" id="floating-outline-btn" onclick="app.toggleOutline()" data-i18n-title="toggleOutline" title="文档大纲 (TOC)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span data-i18n="outline">大纲</span>
      </button>

      <!-- 分栏内容区 -->
      <div class="content-panes" id="content-panes">
        <!-- 源码编辑面板 -->
        <div class="editor-container" id="editor-container" style="display: none;">
          <textarea class="editor-textarea" id="editor-textarea" spellcheck="false" placeholder="在此输入 Markdown 源码..."></textarea>
        </div>

        <!-- 拖拽分割条 -->
        <div class="panes-splitter" id="panes-splitter" style="display: none;"></div>

        <!-- 纯净排版查看面板 (默认显示) -->
        <div class="preview-container" id="preview-container">
          <div class="preview-content" id="preview-content"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast 提示容器 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 保存确认三按钮模态弹窗 (取消、不保存、保存) -->
  <div class="modal-backdrop" id="save-confirm-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" color="var(--primary)">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span class="modal-title" data-i18n="saveConfirmTitle">保存更改</span>
      </div>
      <div class="modal-body" id="save-confirm-message">
        文件尚未保存，是否在关闭前保存更改？
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="app.handleSaveConfirmCancel()" data-i18n="cancel">取消</button>
        <button class="modal-btn danger" onclick="app.handleSaveConfirmDontSave()" data-i18n="dontSave">不保存</button>
        <button class="modal-btn primary" onclick="app.handleSaveConfirmSave()" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <!-- 右键上下文菜单 -->
  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" onclick="app.handleNewFile()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span data-i18n="ctxNewFile">新建文件</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" onclick="if(app.contextTarget && backend) backend.reveal_in_explorer(app.contextTarget.path); app.hideContextMenu();">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      <span data-i18n="ctxReveal">在资源管理器中打开</span>
    </div>
    <div class="context-menu-item" onclick="if(app.contextTarget && backend && confirm(I18N[app.lang].confirmDelete)) { backend.delete_path(app.contextTarget.path, (res)=>{ app.loadWorkspace(app.workspaceData.path); }); } app.hideContextMenu();">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" color="#ef4444"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span style="color:#ef4444;" data-i18n="ctxDelete">删除</span>
    </div>
  </div>

  <!-- 底部极简状态栏 -->
  <div class="statusbar" id="statusbar">
    <div class="statusbar-group">
      <span id="status-path">MiniMark</span>
      <span>|</span>
      <span id="status-encoding">UTF-8</span>
    </div>
    <div class="statusbar-group">
      <span id="status-stats">0 行 | 0 字 | 0 字符</span>
      <span>|</span>
      <span id="status-mode">模式: 仅查看</span>
    </div>
  </div>

  <!-- 应用业务逻辑 -->
  <script src="app.js"></script>
</body>
</html>
